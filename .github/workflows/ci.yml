name: CI

on:
  pull_request:
    branches:
      - main
      - fix/staging-security-audit-v2
      - feat/etehad-secure-invitations-and-rls
  push:
    branches:
      - feat/etehad-secure-invitations-and-rls

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # package-lock.json must stay in sync with package.json for npm ci.
      # Until the repaired lockfile is published, npm install is the reliable install path.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit / static contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck logic
        run: npm run typecheck:logic

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder-not-a-secret
        run: npm run build
