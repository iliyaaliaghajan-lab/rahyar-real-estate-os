name: Verify Migration 008 (Isolated Postgres)

# Independent verification branch only. No Supabase / Staging / Production.
on:
  push:
    branches:
      - verify/migration-008-isolated-postgres
  workflow_dispatch:

concurrency:
  group: verify-008-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: PG ${{ matrix.pg }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
        scenario:
          - safe
          - create
          - setrole
          - neg_schema_owner_member
          - neg_function_owner_member
          - neg_function_owner_preflight_c
          - neg_create_inherit
          - neg_create_setrole
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Install client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run isolated matrix scenario
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PG_VERSION: "${{ matrix.pg }}"
          SCENARIO: "${{ matrix.scenario }}"
          MIGRATIONS_DIR: supabase/migrations
          STUBS_DIR: scripts/isolated-pg
        run: |
          chmod +x scripts/isolated-pg/run_matrix.sh
          scripts/isolated-pg/run_matrix.sh

  contracts:
    name: Static contracts (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit / contract tests
        run: npm test

  summary:
    name: Matrix summary
    runs-on: ubuntu-latest
    needs: [matrix, contracts]
    if: always()
    steps:
      - name: Report and gate
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: |
          echo "Isolated Postgres verification for migration 008 finished."
          echo "Positive: safe, create, setrole"
          echo "Negative (expect SECURITY PREFLIGHT FAILED):"
          echo "  neg_schema_owner_member, neg_function_owner_member,"
          echo "  neg_function_owner_preflight_c (preflight C via event-trigger fixture),"
          echo "  neg_create_inherit, neg_create_setrole"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "Matrix job result: ${MATRIX_RESULT}"
          echo "Contracts job result: ${CONTRACTS_RESULT}"
          if [ "$MATRIX_RESULT" != "success" ] || [ "$CONTRACTS_RESULT" != "success" ]; then
            echo "FAIL: matrix or contracts job did not succeed"
            exit 1
          fi
          echo "PASS: matrix (24 cells) and static contracts both succeeded"
