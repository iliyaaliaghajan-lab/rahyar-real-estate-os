name: Isolated Invitation P0 (Postgres)

# Temporary isolated Postgres only. No Supabase / Staging / Production.
on:
  push:
    branches:
      - feat/etehad-secure-invitations-and-rls
  pull_request:
    # GitHub pull_request.branches filters the PR *base* (target) branch.
    branches:
      - fix/staging-security-audit-v2
  workflow_dispatch:

concurrency:
  group: isolated-inv-p0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-integration:
    name: Invitation P0 (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Install client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve postgres service container IP
        # job.services.postgres.id is the exact Docker container for this job's
        # postgres service. We allow only that container's IPv4 — not a CIDR.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          if [[ -z "${POSTGRES_CONTAINER_ID}" ]]; then
            echo "job.services.postgres.id is empty"
            exit 1
          fi
          # Prefer the first IPv4 on the default bridge network for this container.
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{println}}{{end}}' "$POSTGRES_CONTAINER_ID" | awk 'NF{print; exit}')
          if [[ -z "$IP" ]]; then
            echo "Could not resolve IPv4 for postgres service container"
            exit 1
          fi
          # Validate single dotted-quad IPv4
          if ! [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Resolved address is not a valid IPv4: $IP"
            exit 1
          fi
          echo "P0_ALLOWED_SERVER_ADDR=$IP" >> "$GITHUB_ENV"
          echo "P0_ALLOW_SERVICE_CONTAINER=1" >> "$GITHUB_ENV"
          echo "Inspected postgres service container IP: $IP"

      - name: Run invitation P0 tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CONCURRENCY_ROUNDS: "5"
          MIGRATIONS_DIR: supabase/migrations
          STUBS_DIR: scripts/isolated-pg
          # P0_ALLOWED_SERVER_ADDR and P0_ALLOW_SERVICE_CONTAINER come from GITHUB_ENV
        run: |
          chmod +x scripts/isolated-pg/run_invitation_p0.sh
          scripts/isolated-pg/run_invitation_p0.sh

  unit-contracts:
    name: Unit / static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
