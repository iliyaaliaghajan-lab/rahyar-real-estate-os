name: Verify Migration 008 (Isolated Postgres)

# Independent verification branch only. No Supabase / Staging / Production.
on:
  push:
    branches:
      - verify/migration-008-isolated-postgres
  workflow_dispatch:

concurrency:
  group: verify-008-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: PG ${{ matrix.pg }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
        scenario: ["safe", "create", "setrole"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Install client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run isolated matrix scenario
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PG_VERSION: "${{ matrix.pg }}"
          SCENARIO: "${{ matrix.scenario }}"
          MIGRATIONS_DIR: supabase/migrations
          STUBS_DIR: scripts/isolated-pg
        run: |
          chmod +x scripts/isolated-pg/run_matrix.sh
          scripts/isolated-pg/run_matrix.sh

  summary:
    name: Matrix summary
    runs-on: ubuntu-latest
    needs: matrix
    if: always()
    steps:
      - name: Report
        run: |
          echo "Isolated Postgres verification for migration 008 finished."
          echo "See individual matrix jobs for PASS/FAIL per PG version and scenario."
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
