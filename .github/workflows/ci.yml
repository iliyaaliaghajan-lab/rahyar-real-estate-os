name: CI

on:
  pull_request:
    branches:
      - main
      - fix/staging-security-audit-v2
      - feat/etehad-secure-invitations-and-rls
  push:
    branches:
      - feat/etehad-secure-invitations-and-rls

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Do not enable cache: npm without a package-lock.json (setup-node fails).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package.json includes @supabase/*; lockfile was out of sync and briefly
      # corrupted during repair. Use npm install until a verified lock is restored.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit / static contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck logic
        run: npm run typecheck:logic

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder-not-a-secret
        run: npm run build
