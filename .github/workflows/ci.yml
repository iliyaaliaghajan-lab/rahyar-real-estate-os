name: CI

on:
  pull_request:
    branches:
      - main
      - fix/staging-security-audit-v2
      - feat/etehad-secure-invitations-and-rls
      - ai/etehad-integration-dryrun-20261030
      - feat/etehad-next16-upgrade
      - feat/etehad-branding-pwa-icons-20261105
      - feat/etehad-cloud-data-foundation-20261112
  push:
    branches:
      - feat/etehad-secure-invitations-and-rls
      - feat/etehad-next16-upgrade
      - feat/etehad-cloud-data-foundation-20261112
      - feat/etehad-supabase-repository-adapter-20261113
      - feat/etehad-role-based-business-delete-20261114

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm environment
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get cache

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=verbose --foreground-scripts --timing

      - name: Unit / static contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck logic
        run: npm run typecheck:logic

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder-not-a-secret
        run: npm run build
