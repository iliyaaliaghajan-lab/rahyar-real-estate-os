# Opt-in live Staging JWT + Data API + RLS smoke for cloud business tables (Migration 009).
# Never runs on push or pull_request.
# Requires GitHub Environment "etehad-staging-security" with secrets:
#   STAGING_SUPABASE_ANON_KEY
#   STAGING_SUPABASE_SERVICE_ROLE_KEY
# Manual confirmation input must be set to true. Branch must be the cloud-data feature branch.
name: Staging cloud data JWT smoke

on:
  workflow_dispatch:
    inputs:
      confirm_staging_run:
        description: >-
          Set to true only to run the live Staging cloud-data JWT smoke against
          project dezonafotwyvvghbccko. Default false refuses the run.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging-cloud-data-jwt-smoke:
    name: Staging cloud data JWT smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Branch pin + explicit confirmation. No push/PR triggers above.
    if: >-
      github.ref == 'refs/heads/feat/etehad-cloud-data-foundation-20261112'
      && inputs.confirm_staging_run == true
    environment:
      name: etehad-staging-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run staging cloud data JWT smoke
        env:
          STAGING_SUPABASE_URL: https://dezonafotwyvvghbccko.supabase.co
          STAGING_SECURITY_TEST_CONFIRM: dezonafotwyvvghbccko
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:staging-cloud-data
